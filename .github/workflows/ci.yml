name: CI

# Sprint 98 Stream D4 — automated pytest + ruff + frontend lint/build
# on every push and PR. Grace period: ruff is informational (continue-
# on-error) for the first week so the codebase's existing style debt
# doesn't block PRs. Switch to required after the next sprint when
# baseline is clean.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Production VM runs Python 3.12 (verified post-Sprint-98 deploy);
      # pin CI to match so requirements.txt resolves identically. Sprint 98
      # initially pinned 3.8 from a stale CLAUDE.md comment — that broke
      # pandas>=2.2.0 install, which is 3.9+. Keep this in sync if the VM
      # Python ever changes.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff) — informational
        working-directory: backend
        continue-on-error: true  # Sprint 98 grace period; tighten in Sprint 99
        run: ruff check .

      - name: Test (pytest)
        working-directory: backend
        run: pytest -q

      # Sprint 98 follow-on — keep specs/architecture-flows.html honest.
      # Structural errors (bad node refs, missing fields, malformed JSON)
      # block. Coverage warnings (routers/services not mentioned in any
      # flow) are informational and pass through.
      - name: Validate architecture-flows.html
        run: python backend/scripts/validate_architecture_flows.py

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true  # 4 pre-existing errors documented in BACKLOG

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.courtvue.app
