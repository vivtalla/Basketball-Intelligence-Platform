# Sprint 98 Stream D — minimal ruff config.
# Goal: catch real bugs (unused imports, undefined names) without
# bikeshedding style. Codebase has 100k+ lines across many sprints;
# turning on broad style rules retroactively would generate noise
# without value.

# Match the repo's existing line length (most files run wide).
line-length = 120

# Python target: project pins 3.8.
target-version = "py38"

# Skip these dirs entirely.
extend-exclude = [
    "venv",
    "alembic/versions",  # auto-generated migrations have their own style
    "scripts/_apply_*",  # one-shot scripts deleted post-sprint
]

[lint]
# Start with a tight rule set focused on real-bug catches. Expand
# in Sprint 99+ once the baseline is clean.
select = [
    "F",     # pyflakes — unused imports, undefined names
    "E9",    # syntax errors
    "W",     # warnings
]

# These are codebase-wide style conflicts that aren't worth retro-fixing.
ignore = [
    "E501",  # line too long — covered by formatter where it matters
    "W291",  # trailing whitespace
    "W292",  # no newline at end of file
    "W293",  # whitespace on blank line
]

[lint.per-file-ignores]
# Test files can have unused imports for re-exports.
"tests/**/*.py" = ["F401"]
# Conftest deliberately imports for side effects.
"tests/conftest.py" = ["F401"]
# __init__.py files commonly re-export.
"**/__init__.py" = ["F401"]
